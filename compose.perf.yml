# Perf-only override, layered on compose.yml:
#   docker compose -f compose.yml -f compose.perf.yml up -d --build --wait
# Caps `api` at the 1 vCPU / 2 GB reference budget every capacity number in
# docs/adrs/0019-per-pr-benchmarks-and-fixed-load-acceptance.md refers to, so the
# app (not the host) is the bottleneck and results compare across machines.
# Backing services stay uncapped on purpose. SYS_PTRACE lets py-spy attach
# (tests/perf/profile.sh); it is granted here and nowhere else.
services:
  api:
    cpus: "1"
    mem_limit: 2g
    cap_add:
      - SYS_PTRACE
    # Every Locust user shares one client IP, and the bulk-action limit is
    # per IP (app.rate_limit, default 20/minute), so the default would turn
    # PATCH/DELETE into 429s at any real load. Raise only the threshold: the
    # limiter's Redis round trip still runs on every request being measured.
    environment:
      RATE_LIMIT_BULK_ACTION: "1000000/minute"
