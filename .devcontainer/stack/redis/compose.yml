# Stack service: Valkey, reachable only from other containers on the
# compose-generated default network (see ../README.md).
services:
  redis:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
