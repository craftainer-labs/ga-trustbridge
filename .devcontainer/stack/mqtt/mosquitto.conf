# Eclipse Mosquitto broker config for app.interfaces.base.MQTTEventSink/
# MQTTEventSource -- see docs/adrs/0015-mqtt-for-crud-events.md.
#
# persistence + persistence_location: required for the delivery guarantee a
# QoS-1, clean_session=False subscriber relies on -- without this, a broker
# restart would drop every queued message for a disconnected persistent
# session.
persistence true
persistence_location /mosquitto/data/

# TLS and password auth, even in local dev: the app's production guardrails (config.py)
# require both, and a dev broker that accepts anonymous plaintext clients would let a
# misconfigured app pass here and fail only in production. No plaintext listener and
# `allow_anonymous false`, so a client that skips TLS or credentials is refused
# (OWASP secure configuration; craftainer_crud's MQTT TLS API).
#
# - listener 8883: the only listener. The certificate is a self-signed dev cert with
#   SAN DNS:mqtt that the one-shot `mqtt-tls-cert` service (compose.yml) writes into the
#   `mqtt-tls` volume; the app mounts the same volume read-only and trusts it through
#   MQTT_CA_FILE. Mosquitto's default allows TLS 1.2 and 1.3 only.
# - password_file: built at container start from mqtt.env's MQTT_USERNAME/MQTT_PASSWORD
#   (compose.yml's command), so no hashed secret is checked in.
#
# Dev-only values, not meant for a real deployment, see ../README.md's "Don't" section.
listener 8883
cafile /tls/mqtt.crt
certfile /tls/mqtt.crt
keyfile /tls/mqtt.key
allow_anonymous false
password_file /mosquitto/passwd

# Bounds on the broker-side queue kept for each disconnected persistent
# session -- this is what makes "briefly offline, no missed events" hold
# without retaining an unbounded backlog forever (see the ADR's "Delivery
# guarantee" section for the reasoning behind these exact numbers):
# - max_queued_messages: up to 1000 queued messages per persistent session.
# - persistent_client_expiration: a persistent session that never reconnects
#   is dropped (with whatever it queued) after 1 hour. "message_expiry_interval"
#   -- named in the plan this was built from -- is actually an MQTT v5
#   per-message PUBLISH property, not a mosquitto.conf directive; this is
#   mosquitto's real broker-wide equivalent for a v3.1.1 client (aiomqtt's
#   default protocol, see app.interfaces.base.MQTTEventSink/MQTTEventSource),
#   confirmed against this pinned image's own default mosquitto.conf.
max_queued_messages 1000
persistent_client_expiration 1h

# max_inflight_messages: Mosquitto's own documented default (20) -- the
# number of QoS-1 messages that can be in flight to one client at once.
max_inflight_messages 20

log_dest stdout
