# gitleaks config (https://github.com/gitleaks/gitleaks#configuration),
# read from the repo root by both the staged and the full-history hooks
# in .pre-commit-config.yaml. Extends the built-in ruleset; add an
# [[allowlists]] entry below only for a specific, reviewed false positive
# (see docs/TEMPLATE.md's "Checks"), scoped as narrowly as possible
# (a path AND/OR a regex, never a whole rule or directory "just in case")
# and always with a description saying why it is safe.

title = "template-base gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Smoke-test dummy SUBSCRIBER_SECRET in compose.yml (not a real credential; the smoke stack is local and ephemeral)"
paths = ['''^compose\.yml$''']
regexes = ['''smoke-test-subscriber-secret-0123456789''']
condition = "AND"

# Instance-owned allowlists (ga-trustbridge): reviewed false positives that the full-history
# scan reports in committed test data and docs. Each is a dummy or planted value.
[[allowlists]]
description = "Argo CD fixture dummy values: base64 of 'dummy-app-key-material' and 'whsec-dummy-value'"
paths = ['''^tests/trustbridge/adapters/argocd/fixtures/(credentials|webhooks)\.json$''']
regexes = ['''ZHVtbXktYXBwLWtleS1tYXRlcmlhbA==''', '''d2hzZWMtZHVtbXktdmFsdWU=''']
regexTarget = "match"
condition = "AND"

[[allowlists]]
description = "Planted canary secrets the tests assert are never logged or returned (not real credentials)"
paths = ['''^tests/trustbridge/admin/test_(registration_unit|reads_integration)\.py$''']
regexes = ['''whsec-canary-91d2c7''', '''canary-secret-7f3a9c1e''']
regexTarget = "match"
condition = "AND"

[[allowlists]]
description = "Test input that checks a terminal-escape and token-looking admin_disable_reason is sanitised (not a credential)"
paths = ['''^tests/trustbridge/admin/test_reads_unit\.py$''']
regexes = ['''token=abc123def456''']
regexTarget = "match"
condition = "AND"

[[allowlists]]
description = "Prose in the system design table: 'installation tokens, secret/variable/environment writer' (no secret)"
paths = ['''^docs/system-design\.md$''']
regexes = ['''secret/variable/environment''']
regexTarget = "match"
condition = "AND"
