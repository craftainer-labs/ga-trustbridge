{{- if .Values.networkPolicy.enabled }}
{{- $egress := .Values.networkPolicy.egress.enabled }}
{{- if .Values.api.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trustbridge.resourceName" (dict "suffix" "api" "context" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trustbridge.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trustbridge.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $egress }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: {{ .Values.api.port }}
          protocol: TCP
      {{- with .Values.networkPolicy.apiIngressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $egress }}
  egress:
    {{- toYaml .Values.networkPolicy.egress.rules | nindent 4 }}
  {{- end }}
{{- end }}
---
# worker and reconciler accept no ingress from other pods. Their health port is probed by the
# kubelet, and traffic from a pod's own node is always allowed, whatever the policy says
# (https://kubernetes.io/docs/concepts/services-networking/network-policies/), so the probes
# need no rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trustbridge.resourceName" (dict "suffix" "background" "context" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trustbridge.labels" (dict "root" . "component" "background") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "trustbridge.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [worker, reconciler]
  policyTypes:
    - Ingress
    {{- if $egress }}
    - Egress
    {{- end }}
  ingress: []
  {{- if $egress }}
  egress:
    {{- toYaml .Values.networkPolicy.egress.rules | nindent 4 }}
  {{- end }}
{{- end }}
