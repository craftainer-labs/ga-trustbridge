{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trustbridge.resourceName" (dict "suffix" "api" "context" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trustbridge.labels" (dict "root" . "component" "api") | nindent 4 }}
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "trustbridge.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
{{- end }}
